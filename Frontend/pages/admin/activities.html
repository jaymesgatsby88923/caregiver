<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>CareApp | Activities</title>

    <link
        rel="stylesheet"
        href="../../assets/css/common.css">

    <link
        rel="stylesheet"
        href="../../assets/css/layout.css">

    <link
        rel="stylesheet"
        href="../../assets/css/activities.css">

</head>

<body>
<div id="header-container"></div>
    <div class="app-container">


<div id="sidebar-container"></div>
       
        <!-- ======================================
             Main Content
        ======================================= -->

        <main class="main-content">

            <div class="content-wrapper">

                <!-- ===========================
                     Page Header
                ============================ -->

                <section class="page-header">

                    <div>

                        <h2 class="page-title">

                            Activities

                        </h2>

                        <p class="page-subtitle">

                            Manage activities caregivers can perform during client shifts.

                        </p>

                    </div>

                    <button
                        id="add-activity-button"
                        class="primary-button">

                        + Add Activity

                    </button>

                </section>



                <!-- ===========================
                     Summary
                ============================ -->

                <section class="page-section">

                    <div class="summary-chips">

                        <div class="summary-chip">

                            <span
                                id="total-activities">

                                0

                            </span>

                            Total

                        </div>

                        <div class="summary-chip active-chip">

                            <span
                                id="active-activities">

                                0

                            </span>

                            Active

                        </div>

                        <div class="summary-chip inactive-chip">

                            <span
                                id="inactive-activities">

                                0

                            </span>

                            Inactive

                        </div>

                    </div>

                </section>



                <!-- ===========================
                     Search
                ============================ -->

                <section class="page-section">

                    <div class="search-container">

                        <input
                            id="search-input"
                            type="search"
                            placeholder="Search activities...">

                    </div>

                </section>



                <!-- ===========================
                     Activity List
                ============================ -->

                <section
                    id="activity-list"
                    class="activity-list">

                    <!-- Activity cards inserted by JavaScript -->

                </section>
                                <!-- ===========================
                     Empty State
                ============================ -->

                <section
                    id="empty-state"
                    class="empty-state hidden">

                    <div class="empty-icon">

                        📋

                    </div>

                    <h3>

                        No Activities Found

                    </h3>

                    <p>

                        Add your first activity or adjust your search.

                    </p>

                    <button
                        id="empty-add-button"
                        class="primary-button">

                        + Add Activity

                    </button>

                </section>

            </div>

        </main>

    </div>


    <!-- ======================================
         Activity Modal
    ======================================= -->

    <div
        id="activity-modal"
        class="modal hidden">

        <div class="modal-overlay"></div>

        <div class="modal-content">

            <div class="modal-header">

                <h2
                    id="modal-title">

                    Add Activity

                </h2>

                <button
                    id="close-modal-button"
                    class="icon-button">

                    X

                </button>

            </div>


            <form
                id="activity-form">

                <input
                    type="hidden"
                    id="activity-id">


                <div class="form-group">

                    <label
                        for="activity-name">

                        Activity Name

                    </label>

                    <input
                        id="activity-name"
                        type="text"
                        maxlength="100">

                    <span
                        id="activity-name-error"
                        class="error-message">

                    </span>

                </div>


                <div class="form-group">

                    <label
                        for="activity-description">

                        Description

                    </label>

                    <textarea
                        id="activity-description"
                        rows="5"
                        maxlength="500">

                    </textarea>

                    <span
                        id="activity-description-error"
                        class="error-message">

                    </span>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        id="cancel-button"
                        class="secondary-button">

                        Cancel

                    </button>

                    <button
                        type="submit"
                        id="save-button"
                        class="primary-button">

                        Save Activity

                    </button>

                </div>

            </form>

        </div>

    </div>


    <script
        src="../../assets/js/common.js">

    </script>

    <script
        src="../../assets/js/activities.js">

    </script>

</body>

</html>
