<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CareApp | Login</title>

    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="../assets/css/login.css">

</head>

<body>

    <main class="login-page">

        <section class="card login-card">

            <h1>CareApp</h1>

            <p class="subtitle">
                Welcome back! Sign in to continue.
            </p>

            <div id="message-container"></div>

            <form id="login-form">

                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                    <small
                        id="email-error"
                        class="error-message">
                    </small>

                </div>

                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <small
                        id="password-error"
                        class="error-message">
                    </small>

                </div>

                <!-- Remember Me -->

                <div class="checkbox-row">

                    <label>

                        <input
                            type="checkbox"
                            id="remember-me"
                        >

                        Remember Me

                    </label>

                </div>

                <!-- Login Button -->

                <button
                    type="submit"
                    id="login-button">

                    Sign In

                </button>

            </form>

            <div class="login-links">

                <a href="#">
                    Forgot Password?
                </a>

                <p>

                    Don't have an account?

                    <a href="register.html">

                        Register

                    </a>

                </p>

            </div>

        </section>

    </main>

    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/login.js"></script>

</body>

</html>
