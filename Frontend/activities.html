<!DOCTYPE html>

<html>
<head>
    <title>Activities</title>
</head>

<body>
<div id="page">
```
    <div id="leftPanel">

        <h1>Care Activities</h1>

        <div id="activities"></div>

        <div id="manageActivityPanel" hidden>
            <h2 id = "manageTitle"> Manage Activity</h2>
            <h3 id="manageActivityTitle"></h3>
            <button id="renameButton" onclick=updateActivity()>Rename</button>
            <button id="deleteButton" onclick=deleteActivity()>Delete</button>
            <button id="cancelButton">Cancel</button>
        </div>
    </div>
    <div id="rightPanel">
            <h2>New Activity</h2>
            <input
            type="text"
            id="activityName"
            placeholder="Enter activity name">
            <button onclick="addActivity()">Add Activity</button>
    </div>
</div>
<script src="Activities.js"></script>


</body>
</html>
